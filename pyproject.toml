[project]
name = "staat-mbo"
version = "0.1.0"
description = "Staat van de Onderwijsinstelling voor het MBO uit gestapelde DUO-bekostigingsbestanden"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "CEDA", email = "ceda@cedanl.org" }]
dependencies = [
    "polars>=1.0",
    "mbo-bekostiging-bestanden",
]

[project.scripts]
smbo = "staat_mbo.cli:main"

[tool.uv.sources]
mbo-bekostiging-bestanden = { git = "https://github.com/cedanl/mbo-bekostiging-bestanden", rev = "05d5c5be33a68b1f7b7a53c57df22cb3a46a3063" }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
demo = ["playwright>=1.50", "piper-tts>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staat_mbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
